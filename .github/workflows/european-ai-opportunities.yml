name: European open AI opportunity pilot

on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 2'
  push:
    branches: [main]
    paths:
      - eu_opportunity_sources.json
      - eu_opportunity_discovery.py
      - eu_source_discovery.py
      - arxiv_source_discovery.py
      - publication_organizations.py
      - publication_openaire.py
      - tests/test_publication_openaire.py
      - tests/test_publication_organizations.py
      - tests/test_arxiv_source_discovery.py
      - discovered_source_triage.py
      - tests/test_discovered_source_triage.py
      - generic_source_discovery.py
      - tests/test_generic_source_discovery.py
      - tests/test_eu_source_discovery.py
      - opportunity_quality_review.py
      - studies/eu_opportunity_quality_20261121/reviews.json
      - opportunity_state.py
      - http_util.py
      - tests/test_eu_opportunity_discovery.py
      - tests/test_opportunity_quality_review.py
      - .github/workflows/european-ai-opportunities.yml
  pull_request:
    paths:
      - eu_opportunity_sources.json
      - eu_opportunity_discovery.py
      - eu_source_discovery.py
      - arxiv_source_discovery.py
      - publication_organizations.py
      - publication_openaire.py
      - tests/test_publication_openaire.py
      - tests/test_publication_organizations.py
      - tests/test_arxiv_source_discovery.py
      - discovered_source_triage.py
      - tests/test_discovered_source_triage.py
      - generic_source_discovery.py
      - tests/test_generic_source_discovery.py
      - tests/test_eu_source_discovery.py
      - opportunity_quality_review.py
      - studies/eu_opportunity_quality_20261121/reviews.json
      - opportunity_state.py
      - http_util.py
      - tests/test_eu_opportunity_discovery.py
      - tests/test_opportunity_quality_review.py
      - .github/workflows/european-ai-opportunities.yml

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline tests
        run: python -m unittest discover -s tests -v

  discovery:
    if: github.event_name != 'pull_request'
    needs: tests
    permissions:
      contents: write
    concurrency:
      group: eu-discovery-state
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore cumulative discovery state
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .discovery-state
          set +e
          git ls-remote --exit-code --heads origin refs/heads/eu-discovery-state > .discovery-state/remote
          status=$?
          set -e
          case "$status" in
            0)
              git fetch --no-tags origin refs/heads/eu-discovery-state
              git rev-parse FETCH_HEAD > .discovery-state/parent
              git show FETCH_HEAD:source_candidates.json > .discovery-state/source_candidates.json
              if git cat-file -e FETCH_HEAD:source_triage.json 2>/dev/null; then
                git show FETCH_HEAD:source_triage.json > .discovery-state/source_triage.json
              fi
              ;;
            2) echo "No prior state branch; starting a new registry" ;;
            *) exit "$status" ;;
          esac
      - name: Read-only EU open AI issue review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python eu_opportunity_discovery.py --sources eu_opportunity_sources.json --output results/european_ai --review-ledger studies/eu_opportunity_quality_20261121/reviews.json --discover-sources --previous-candidates .discovery-state/source_candidates.json
      - name: Review newly discovered repositories
        id: source_triage
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python discovered_source_triage.py --snapshot results/european_ai/source_candidates.json --previous .discovery-state/source_triage.json --output results/european_ai
      - name: Preserve successful source review
        if: steps.source_triage.outcome == 'success'
        run: cp results/european_ai/source_triage.json .discovery-state/source_triage.json
      - name: Publish successful cumulative state to dedicated branch
        if: success() && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          blob=$(git hash-object -w results/european_ai/source_candidates.json)
          tree=$({
            printf '100644 blob %s\tsource_candidates.json\n' "$blob"
            if [ -f .discovery-state/source_triage.json ]; then
              review=$(git hash-object -w .discovery-state/source_triage.json)
              printf '100644 blob %s\tsource_triage.json\n' "$review"
            fi
          } | git mktree)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          args=()
          if [ -f .discovery-state/parent ]; then
            args=(-p "$(cat .discovery-state/parent)")
          fi
          commit=$(git commit-tree "$tree" "${args[@]}" -m "Update cumulative discovery state")
          git push origin "$commit:refs/heads/eu-discovery-state"
      - name: Preserve evidence and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: european-open-ai-opportunities
          path: results/european_ai/
          if-no-files-found: warn

  live-source-smoke:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: tests
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify real public GitHub and Hugging Face sources
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          from eu_source_discovery import discover, write_report, canonical, detail_url, hf_json
          from http_util import get_json
          result = discover({"repositories": [{"repo": "openeurollm/oellm-eval"}]},
                            max_owners=1, max_follow=3)
          write_report(result, "results/source-smoke")
          print("Listings:", result["listings"])
          print("Details:", result["detail_checks"])
          print("Errors:", result["errors"])
          assert not result["errors"], result["errors"]
          assert {x["adapter"] for x in result["listings"] if x["count"]} == {"github", "huggingface"}
          repo = get_json(detail_url(("repository", "openeurollm/oellm-eval")),
                          user_agent="eu-discovery-smoke", timeout=15, attempts=2)[0]
          assert repo["full_name"].lower() == "openeurollm/oellm-eval"
          models = [x for x in result["candidates"] if x["kind"] == "model"
                    and x.get("identity_status") == "confirmed_public_metadata"]
          assert models, "No public model returned by the scoped listing"
          key = canonical(models[0]["url"])
          assert hf_json(detail_url(key))["id"] == key[1]
          print("Live source identity checks passed.")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eu-source-live-smoke
          path: results/source-smoke/
          if-no-files-found: warn

  live-generic-source-smoke:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: tests
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Discover from the single public RAISE seed
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from generic_source_discovery import discover_web
          from eu_source_discovery import canonical
          seed = "https://raise4science.eu/"
          result = discover_web([seed], platform_key=canonical, max_pages=2)
          out = Path("results/generic-source-smoke")
          out.mkdir(parents=True, exist_ok=True)
          (out / "source_candidates.json").write_text(json.dumps(result, indent=2), encoding="utf-8")
          print("Core:", result["sources"][seed])
          print("New public sources:", len(result["sources"]) - 1)
          print("Evidence:", result["references"][:10])
          print("Platform references:", result["platform_refs"])
          print("Errors:", result["errors"])
          assert result["sources"][seed]["status"] == "read", result["sources"][seed]
          assert len(result["sources"]) > 1, "No source discovered from the single core seed"
          assert result["references"], "No original link evidence"
          print("Single-seed discovery passed.")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: generic-source-live-smoke
          path: results/generic-source-smoke/
          if-no-files-found: warn

  live-discovered-triage:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: tests
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Review real discovered sources from published state
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch --no-tags origin refs/heads/eu-discovery-state
          git rev-parse FETCH_HEAD
          mkdir -p .discovery-state
          git show FETCH_HEAD:source_candidates.json > .discovery-state/source_candidates.json
          python discovered_source_triage.py --snapshot .discovery-state/source_candidates.json --output results/discovered-triage
          cat results/discovered-triage/SOURCE_TRIAGE.md
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path("results/discovered-triage/source_triage.json").read_text())
          assert result["pool_size"] and result["selected"] and result["metadata"]
          assert any(x.get("status") == "review_only" for x in result["metadata"])
          assert len(result["tasks"]) <= 5 and len(result["topic_hypotheses"]) <= 5
          assert all(x["status"] == "unverified_topic_overlap" for x in result["topic_hypotheses"])
          print("Live discovery review generated; inspect diagnostics and evidence, not just exit status.")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-discovered-source-triage
          path: results/discovered-triage/
          if-no-files-found: warn

  live-publication-smoke:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify real arXiv metadata and record generic search coverage
        run: |
          python - <<'PY'
          import datetime as dt
          import json
          import time
          from pathlib import Path
          from arxiv_source_discovery import discover_publications, fetch_atom, parse_atom, API
          from publication_organizations import resolve, ror_json, parse_ror, ROR_API
          from publication_openaire import enrich as enrich_openaire
          import urllib.parse
          # Transport/parser smoke is deliberately separate from generic discovery recall.
          total, _, rows = parse_atom(fetch_atom(API + "?id_list=2611.15250"))
          assert total and any(row["id"] == "2611.15250" for row in rows), rows
          time.sleep(3.1)
          # Freeze the retrospective time window; no company name or paper ID in query.
          result, _ = discover_publications(dt.datetime(2026, 11, 24, 18, tzinfo=dt.timezone.utc))
          out = Path("results/publication-smoke")
          out.mkdir(parents=True, exist_ok=True)
          match = next((p for p in result["papers"] if p["id"] == "2611.15250"), None)
          report = {"direct_id_transport": True, "generic_query_found_paper": match is not None,
                    "generic_query_affiliation_status": match["affiliation_status"] if match else "not_found",
                    "european_affiliation_verified": False, "result": result}
          # Resolve the discovered record only; no hard-coded institution search.
          if match:
              orgs = resolve([match], dt.datetime.now(dt.timezone.utc))
              report["organization_discovery"] = orgs
              oa = enrich_openaire([match], dt.datetime.now(dt.timezone.utc))
              report["openaire_discovery"] = oa
              observation = oa["papers"][match["id"]]
              print("OpenAIRE target status:", observation["last_attempt_status"])
              print("OpenAIRE target diagnostics:", oa["errors"])
              raw = orgs["papers"][match["id"]]["raw_affiliations"]
              print("Explicit affiliation observations:", raw)
              print("Registry organization candidates:", list(orgs["organizations"]))
              print("Organization diagnostics:", orgs["errors"])
              print("Multiverse affiliation found:", any("multiverse computing" in x.lower() for x in raw))
          (out / "publication_smoke.json").write_text(json.dumps(report, indent=2), encoding="utf-8")
          print("Generic query paper found:", match is not None)
          print("Coverage:", result["coverage"], "Errors:", result["errors"])
          assert not result["errors"], result["errors"]
          assert result["papers"], "No papers returned by generic discovery"
          # Independent service/schema smoke, not evidence about the target paper.
          probe = parse_ror(ror_json(ROR_API + "?" + urllib.parse.urlencode({"affiliation": "University of Helsinki, Finland"})))
          assert probe["status"] == "registry_match_candidate" and "FI" in probe["countries"], probe
          # Known indexed control from existing research graph audit.
          control = enrich_openaire([{"id": "2609.24797", "version_id": "2609.24797v1"}], dt.datetime.now(dt.timezone.utc))
          (out / "openaire_control.json").write_text(json.dumps(control, indent=2), encoding="utf-8")
          print("OpenAIRE control status:", control["papers"]["2609.24797"]["last_attempt_status"])
          assert not control["errors"], control["errors"]
          assert control["papers"]["2609.24797"]["status"] == "matched"
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arxiv-publication-smoke
          path: results/publication-smoke/
