name: European open AI opportunity pilot

on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 2'
  push:
    branches: [main]
    paths:
      - eu_opportunity_sources.json
      - eu_opportunity_discovery.py
      - opportunity_quality_review.py
      - studies/eu_opportunity_quality_20261121/reviews.json
      - opportunity_state.py
      - http_util.py
      - tests/test_eu_opportunity_discovery.py
      - tests/test_opportunity_quality_review.py
      - .github/workflows/european-ai-opportunities.yml
  pull_request:
    paths:
      - eu_opportunity_sources.json
      - eu_opportunity_discovery.py
      - opportunity_quality_review.py
      - studies/eu_opportunity_quality_20261121/reviews.json
      - opportunity_state.py
      - http_util.py
      - tests/test_eu_opportunity_discovery.py
      - tests/test_opportunity_quality_review.py
      - .github/workflows/european-ai-opportunities.yml

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline tests
        run: python -m unittest discover -s tests -v

  discovery:
    if: github.event_name != 'pull_request'
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read-only EU open AI issue review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python eu_opportunity_discovery.py --sources eu_opportunity_sources.json --output results/european_ai --review-ledger studies/eu_opportunity_quality_20261121/reviews.json
      - name: Preserve evidence and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: european-open-ai-opportunities
          path: results/european_ai/
          if-no-files-found: warn
