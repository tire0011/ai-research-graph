name: PR opportunity gate tests
on:
  push:
    paths:
      - "pr_opportunity_gate.py"
      - "deepeval_pr_opportunity.py"
      - "tests/test_pr_opportunity_gate.py"
      - ".github/workflows/pr-opportunity-gate.yml"
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -p test_pr_opportunity_gate.py -v
