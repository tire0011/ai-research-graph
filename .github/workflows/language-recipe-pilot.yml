name: Language recipe pilot unit tests
on:
  push:
    paths:
      - "train_language_lora.py"
      - "adapter_geometry.py"
      - "tests/test_train_language_lora.py"
      - "tests/test_adapter_geometry.py"
      - ".github/workflows/language-recipe-pilot.yml"
  workflow_dispatch:
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install numpy
      - run: python -m unittest discover -s tests -p test_train_language_lora.py -v
      - run: python -m unittest discover -s tests -p test_adapter_geometry.py -v
