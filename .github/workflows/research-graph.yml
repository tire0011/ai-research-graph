name: Research graph probe

on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'
  push:
    branches: [main]
    paths-ignore:
      - 'results/**'
      - 'research_checkpoints/**'
      - 'studies/**'
      - '**/*.md'

concurrency:
  group: research-graph-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  research-graph:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Reproduce paired source-evidence parity (frozen pilot)
        run: |
          if [ ! -f studies/decision_pilot_20261115/PAIRED_PARITY.json ]; then
            python paired_decision_evidence.py --frozen studies/decision_pilot_20261115/FROZEN_EVIDENCE.json --output studies/decision_pilot_20261115/PAIRED_PARITY.json
          fi
      - name: Public metadata snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python research_graph.py --output results
      - name: Verify research question evidence
        run: python qa_probe.py --snapshot results/snapshot.json --output results/QA_EVIDENCE.md
      - name: Compare evidence-graph retrieval with source-text scan
        run: python retrieval_benchmark.py --snapshot results/snapshot.json --output results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: research-graph-snapshot
          path: results/
      - name: Save results in repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/REPORT.md results/snapshot.json results/QA_EVIDENCE.md results/RETRIEVAL_BENCHMARK.md results/retrieval_benchmark.json studies/decision_pilot_20261115/PAIRED_PARITY.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'data: update research graph snapshot'
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep "$attempt"
          done
          exit 1
