name: Research question holdout study

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Research graph probe"]
    types: [completed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: research-question-holdout
  cancel-in-progress: false

jobs:
  holdout:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Independently verify ten original GitHub issues
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python holdout_study.py --snapshot results/snapshot.json --output results
      - name: Publish evidence or source-error diagnostics
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: research-question-holdout
          path: |
            results/HOLDOUT_EVIDENCE*.md
            results/holdout_evidence*.json
      - name: Commit only successful verification
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/HOLDOUT_EVIDENCE.md results/holdout_evidence.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'data: verify ten held-out research questions'
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep "$attempt"
          done
          exit 1
