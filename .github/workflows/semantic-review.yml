name: Semantic evidence review

on:
  pull_request:
    paths:
      - semantic_review.py
      - tests/test_semantic_review.py
      - studies/semantic_review_pilot/**
      - .github/workflows/semantic-review.yml
  workflow_dispatch:
    inputs:
      mode:
        description: Evidence set
        type: choice
        options:
          - calibration
          - benchmark
          - discovered
        default: calibration
  schedule:
    - cron: '17 8 * * 3'

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p 'test_semantic_review.py' -v

  review:
    needs: tests
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || vars.SEMANTIC_REVIEW_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    concurrency:
      group: semantic-review
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Review public evidence (5 default, 20 explicit benchmark)
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          MODEL: ${{ vars.SEMANTIC_REVIEW_MODEL || 'mistral-small-latest' }}
          MODE: ${{ inputs.mode || 'discovered' }}
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$MISTRAL_API_KEY" ]; then
            echo "::error::Configure MISTRAL_API_KEY in Actions secrets before enabling model calls."
            exit 1
          fi
          limit=5
          if [ "$MODE" = "discovered" ]; then
            git fetch --no-tags origin refs/heads/eu-discovery-state
            mkdir -p results
            git show FETCH_HEAD:source_triage.json > results/source_triage.json
            args=(--triage results/source_triage.json)
          elif [ "$MODE" = "benchmark" ]; then
            args=(--cases studies/semantic_review_pilot/cases.json)
            limit=20
          elif [ "$MODE" = "calibration" ]; then
            args=(--cases studies/semantic_review_pilot/cases.json)
            limit=3
          else
            echo "::error::Unknown review mode"
            exit 1
          fi
          python semantic_review.py "${args[@]}" --provider mistral --model "$MODEL" --limit "$limit" --output results/semantic
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semantic-review
          path: results/semantic/
          if-no-files-found: warn
